name: HyperExecute Tests

on:
  push:
    branches: [upgrade-wdio-latest, upgrade-wdio-v9]
  pull_request:
    branches: [upgrade-wdio-latest, upgrade-wdio-v9]
  workflow_dispatch:

jobs:
  hyperexecute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Setup HyperExecute CLI
        run: |
          curl -LO https://downloads.lambdatest.com/hyperexecute/linux/hyperexecute
          chmod +x hyperexecute
          sudo mv hyperexecute /usr/local/bin/
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}

      - name: Execute on HyperExecute
        run: hyperexecute --user ${{ secrets.LT_USERNAME }} --key ${{ secrets.LT_ACCESS_KEY }} --config hyperexecute.yaml
