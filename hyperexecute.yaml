version: 0.1
globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90

runson: linux

autosplit: true

concurrency: 2

tunnel: false

runtime:
  - language: node
    version: "22"

pre:
  - npm install

cacheKey: '{{ checksum "package-lock.json" }}'

cacheDirectories:
  - node_modules

testDiscovery:
  type: raw
  mode: remote
  command: grep -rl 'describe' tests/*.spec.ts

testRunnerCommand: npx wdio run ./wdio.conf.ts --spec $test

jobLabel: ['wdio', 'selenium', 'linux', 'autosplit']
